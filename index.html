<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本日の要チェックGIRL｜HTML作成ツール</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
background:linear-gradient(135deg,#efffff,#fff0fb,#f7fff0);
color:#4b3b52
}

.wrap{
max-width:900px;
margin:auto;
padding:22px 14px 50px
}

h1{
margin:0;
color:#ff35b7;
font-size:28px;
text-align:center
}

.sub{
text-align:center;
color:#777;
margin:7px 0 22px
}

.card{
background:#fff;
border:2px solid #ff75ca;
border-radius:20px;
padding:18px;
margin:14px 0;
box-shadow:0 8px 20px #d8c5dc55
}

label{
font-weight:800;
display:block;
margin-bottom:8px;
color:#e51aa2
}

textarea{
width:100%;
min-height:220px;
border:2px dashed #55c9ee;
border-radius:14px;
padding:14px;
font-size:14px;
line-height:1.5;
resize:vertical
}

button{
border:0;
border-radius:14px;
padding:14px 20px;
font-size:16px;
font-weight:800;
cursor:pointer
}

.primary{
background:linear-gradient(90deg,#ff55bd,#a66bff);
color:#fff;
width:100%;
margin-top:12px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.field{
background:#fff8fd;
border-radius:12px;
padding:10px
}

.field b{
display:block;
font-size:12px;
color:#999;
margin-bottom:3px
}

.field span{
font-weight:700
}

.preview{
background:#fff;
border-radius:18px;
padding:16px;
text-align:center
}

.preview img{
max-width:180px;
max-height:240px;
object-fit:cover;
border-radius:14px
}

.output{
min-height:260px
}

.small{
font-size:12px;
color:#888;
line-height:1.6
}

@media(max-width:600px){
.grid{
grid-template-columns:1fr
}

h1{
font-size:23px
}
}
</style>
</head>

<body>

<div class="wrap">

<h1>♡ 本日の要チェックGIRL ♡</h1>

<p class="sub">
自動取得したソースを貼り付けるだけで掲載用HTMLを作成
</p>


<div class="card">

<label>
① 自動取得したソースをここに貼り付け
</label>

<textarea
id="source"
placeholder="★★★ここに自動取得したソースを貼り付け★★★">
</textarea>

<button
class="primary"
onclick="parseSource()">
情報を自動取得する
</button>

<p class="small">
※ 画像URL・女の子ページURL・名前・年齢・スリーサイズ・出勤時間・キャッチコピーなど、貼り付けたHTMLから読み取れる情報を自動で拾います。
</p>

</div>


<div class="card">

<label>
② 取得結果
</label>

<div class="grid">

<div class="field">
<b>名前・年齢</b>
<span id="name">—</span>
</div>

<div class="field">
<b>スリーサイズ</b>
<span id="size">—</span>
</div>

<div class="field">
<b>出勤時間</b>
<span id="schedule">—</span>
</div>

<div class="field">
<b>キャッチコピー</b>
<span id="catch">—</span>
</div>

</div>

</div>


<div class="card">

<label>
③ プレビュー
</label>

<div class="preview" id="preview">
情報を取得するとここに表示されます
</div>

</div>


<div class="card">

<label>
④ 掲載用HTML
</label>

<textarea
id="output"
class="output"
readonly
placeholder="ここに完成HTMLが表示されます">
</textarea>

<button
class="primary"
onclick="copyOutput()">
HTMLをコピー
</button>

</div>

</div>


<script>

function clean(s){

const d=document.createElement('div');

d.innerHTML=s||'';

return (d.textContent||d.innerText||'')
.replace(/\s+/g,' ')
.trim();

}


function parseSource(){

const raw=document.getElementById('source').value;

if(!raw.trim()){

alert('ソースを貼り付けてください');

return;

}


const doc=new DOMParser()
.parseFromString(raw,'text/html');


const imgs=[...doc.querySelectorAll('img[src]')]
.map(x=>x.src)
.filter(Boolean);


const links=[...doc.querySelectorAll('a[href]')]
.map(x=>x.href)
.filter(x=>/cityheaven\.net/i.test(x));


const text=clean(doc.body.innerHTML);


let name='—';
let size='—';
let schedule='—';
let catcher='—';


const namePatterns=[

/([^<>\n]{1,30}?)\s*[（(]\s*(\d{1,2})\s*[)）]/,

/([^<>\n]{1,30}?)\s*(?:（|\()\s*(\d{1,2})\s*(?:）|\))/

];


for(const p of namePatterns){

const m=text.match(p);

if(m){

name=m[1].trim()+' ('+m[2]+')';

break;

}

}


const sm=text.match(
/T\s*\d{2,3}\s*B\s*\d{2,3}\s*\([^)]*\)\s*W\s*\d{2,3}\s*H\s*\d{2,3}/i
);


if(sm){

size=sm[0].replace(/\s+/g,' ');

}


const sch=text.match(
/出勤時間\s*[:：]?\s*([0-9]{1,2}:[0-9]{2})\s*[～〜-]\s*([0-9]{1,2}:[0-9]{2})/
);


if(sch){

schedule=sch[1]+'～'+sch[2];

}


const cands=[...doc.querySelectorAll(
'a,span,strong,div'
)]
.map(x=>clean(x.innerHTML))
.filter(x=>x.length>=5&&x.length<=80);


const keywords=[
'美女',
'美少女',
'スタイル',
'ルックス',
'アイドル',
'モデル',
'クラス',
'ホスピタリティ',
'愛嬌'
];


catcher=
cands.find(x=>
keywords.some(k=>x.includes(k)) &&
!/T\d|出勤時間|\d{2,3}\s*円/.test(x)
)
||'—';


document.getElementById('name')
.textContent=name;

document.getElementById('size')
.textContent=size;

document.getElementById('schedule')
.textContent=schedule;

document.getElementById('catch')
.textContent=catcher;


const img=imgs[0]||'';

const url=links[0]||'#';


document.getElementById('preview').innerHTML=

(img?
'<img src="'+escapeAttr(img)+'" alt="">'
:'')+

'<h2 style="color:#ff00aa;margin:10px 0 4px">'+
escapeHtml(name)+
'</h2>'+

'<div style="color:#ff00aa;font-weight:800">'+
escapeHtml(catcher)+
'</div>'+

'<div style="color:#ff00aa;font-weight:800;margin-top:6px">'+
escapeHtml(size)+
'</div>'+

'<div style="color:#ff00aa;font-weight:800;margin-top:6px">'+
'出勤時間 '+
escapeHtml(schedule)+
'</div>';


const html=

`<div style="text-align:center;background:#fff4fc;border:1px solid #2dc7ff;padding:18px;border-radius:16px;margin:12px 0;">

<a href="${escapeAttr(url)}"
style="text-decoration:none;color:#ff00aa;font-weight:bold;">

${img?
`<img src="${escapeAttr(img)}"
style="max-width:320px;width:100%;height:auto;border-radius:12px;"><br>`
:''}

<span style="font-size:22px;">
${escapeHtml(name)}
</span><br>

<span style="font-size:18px;">
${escapeHtml(catcher)}
</span><br>

<span style="font-size:18px;">
${escapeHtml(size)}
</span><br>

<span style="font-size:18px;">
出勤時間 ${escapeHtml(schedule)}
</span>

</a>

</div>`;


document.getElementById('output').value=html;

}


function escapeHtml(s){

return String(s).replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);

}


function escapeAttr(s){

return escapeHtml(s);

}


async function copyOutput(){

const v=document.getElementById('output').value;

if(!v){

alert('先に情報を自動取得してください');

return;

}

try{

await navigator.clipboard.writeText(v);

alert('掲載用HTMLをコピーしました！');

}

catch(e){

const t=document.getElementById('output');

t.removeAttribute('readonly');

t.select();

document.execCommand('copy');

t.setAttribute('readonly','');

alert('コピーしました！');

}

}

</script>

</body>
</html>
