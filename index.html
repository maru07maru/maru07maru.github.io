<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>掲載HTML作成ツール</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:0;
font-family:
-apple-system,
BlinkMacSystemFont,
"Hiragino Kaku Gothic ProN",
"Yu Gothic",
Meiryo,
sans-serif;

background:
linear-gradient(
135deg,
#efffff,
#fff0fb,
#f7fff0
);

color:#555;
}

.container{
max-width:900px;
margin:0 auto;
padding:20px 14px 50px;
}

h1{
text-align:center;
margin:0;
color:#ff35b7;
font-size:26px;
}

.subtitle{
text-align:center;
font-size:13px;
color:#888;
margin:8px 0 20px;
}

.box{
background:#fff;
border:2px solid #ff75ca;
border-radius:20px;
padding:18px;
margin-bottom:16px;
box-shadow:
0 8px 20px rgba(180,130,180,.15);
}

.title{
font-size:17px;
font-weight:bold;
color:#e51aa2;
margin-bottom:10px;
}

.explain{
background:#fff8fd;
border-radius:12px;
padding:12px;
font-size:13px;
line-height:1.7;
margin-bottom:12px;
}

textarea{
width:100%;
min-height:280px;

padding:14px;

border:
2px dashed #55c9ee;

border-radius:14px;

font-size:14px;

line-height:1.6;

font-family:
-apple-system,
BlinkMacSystemFont,
"Hiragino Kaku Gothic ProN",
"Yu Gothic",
Meiryo,
sans-serif;

resize:vertical;

background:#fcffff;

outline:none;
}

textarea:focus{
border-color:#ff69c4;
}

button{

width:100%;

border:0;

border-radius:14px;

padding:15px;

margin-top:12px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

.create{
background:
linear-gradient(
90deg,
#ff55bd,
#a66bff
);

color:#fff;
}

.copy{
background:#55c9ee;
color:#fff;
}

.message{

display:none;

margin-top:10px;

padding:10px;

border-radius:10px;

text-align:center;

font-size:13px;

font-weight:bold;

background:#edfff7;

color:#18a66d;

}

.note{

font-size:11px;

color:#999;

line-height:1.6;

margin-top:10px;

}

</style>

</head>


<body>


<div class="container">


<h1>
♡ 掲載HTML作成ツール ♡
</h1>


<div class="subtitle">
抽出したHTMLを貼り付けるだけ
</div>


<div class="box">


<div class="title">
① ここに抽出HTMLを貼り付け
</div>


<div class="explain">

ここに<strong>抽出したHTMLをそのまま貼り付けてください。</strong>

<br>

難しい操作は必要ありません。

<br>

女の子4名分まで自動で読み取って、掲載用HTMLを作成します。

</div>


<textarea
id="source"
placeholder="★★★ ここに抽出HTMLを貼り付け ★★★"
></textarea>


<button
class="create"
onclick="createHTML()"
>

掲載用HTMLを作成する

</button>


</div>



<div class="box">


<div class="title">
② 作成された掲載用HTML
</div>


<textarea
id="result"
readonly
placeholder="ここに完成した掲載用HTMLが表示されます"
></textarea>


<button
class="copy"
onclick="copyHTML()"
>

掲載用HTMLをコピー

</button>


<div
id="message"
class="message"
>

♡ コピーしました！

</div>


<div class="note">

※ 生成されるHTMLは、CityHeavenで使用できる基本タグを中心に構成します。

<br>

※ 「本日の要チェックGIRL」「PICK UP GIRL」などの固定タイトルは生成されません。

</div>


</div>


</div>



<script>


/* ==========================================
   基本処理
========================================== */


function cleanText(text){

return String(text || "")
.replace(/\s+/g," ")
.trim();

}


function escapeHTML(text){

return String(text || "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#39;");

}


/* ==========================================
   HTMLを解析
========================================== */


function getGirls(source){

const parser =
new DOMParser();

const doc =
parser.parseFromString(
source,
"text/html"
);


/* ------------------------------------------
   本文
------------------------------------------ */

const bodyText =
cleanText(
doc.body.innerText || ""
);


/* ------------------------------------------
   女の子ページURL
------------------------------------------ */

const links = [

...doc.querySelectorAll("a[href]")

]

.map(function(a){

return a.getAttribute("href");

})

.filter(function(url){

return url &&
url !== "#" &&
!url.startsWith("javascript:");

});


/* ------------------------------------------
   画像URL
------------------------------------------ */

const images = [

...doc.querySelectorAll("img[src]")

]

.map(function(img){

return img.getAttribute("src");

})

.filter(function(url){

return url &&
!url.startsWith("data:");

});


/* ------------------------------------------
   名前・年齢
------------------------------------------ */

const names = [

...bodyText.matchAll(

/([^\d\s（）()]{1,15})\s*[（(]\s*(\d{1,2})\s*[）)]/g

)

];


/* ------------------------------------------
   スリーサイズ
------------------------------------------ */

const sizes = [

...bodyText.matchAll(

/T\s*:?\s*\d{2,3}\s*B\s*:?\s*\d{2,3}(?:\([A-Z]\))?\s*W\s*:?\s*\d{2,3}\s*H\s*:?\s*\d{2,3}/gi

)

];


/* ------------------------------------------
   出勤時間
------------------------------------------ */

const schedules = [

...bodyText.matchAll(

/出勤時間\s*[:：]?\s*(\d{1,2}:\d{2})\s*[～〜-]\s*(\d{1,2}:\d{2})/g

)

];


/* ------------------------------------------
   キャッチコピー
------------------------------------------ */

const elements = [

...doc.querySelectorAll(
"div,span,p,strong,b,a"
)

];


const candidateTexts = elements

.map(function(el){

return cleanText(
el.innerText
);

})

.filter(function(text){

return text.length >= 5 &&
text.length <= 80;

});


const keywords = [

"美女",
"美少女",
"スタイル",
"ルックス",
"モデル",
"アイドル",
"清楚",
"愛嬌",
"クラス",
"ホスピタリティ",
"パイパン",
"抜群",
"可愛い",
"かわいい",
"美人"

];


const catches =
candidateTexts.filter(function(text){

return keywords.some(function(keyword){

return text.includes(keyword);

})

&&

!text.includes("出勤時間")

&&

!/^T\s*\d/i.test(text);

});


/* ------------------------------------------
   何人取得するか
------------------------------------------ */

const count =
Math.min(

4,

Math.max(

names.length,

sizes.length,

schedules.length,

images.length

)

);


/* ------------------------------------------
   女の子情報
------------------------------------------ */

const girls = [];


for(
let i=0;
i<count;
i++
){


let name = "";

let age = "";


if(names[i]){

name =
cleanText(
names[i][1]
);

age =
cleanText(
names[i][2]
);

}


let size = "";


if(sizes[i]){

size =
cleanText(
sizes[i][0]
);

}


let schedule = "";


if(schedules[i]){

schedule =
schedules[i][1]
+
"～"
+
schedules[i][2];

}


let catchCopy = "";


if(catches[i]){

catchCopy =
cleanText(
catches[i]
);

}


let url = "";


if(links[i]){

url =
links[i];

}


let image = "";


if(images[i]){

image =
images[i];

}


girls.push({

name:name,

age:age,

size:size,

schedule:schedule,

catchCopy:catchCopy,

url:url,

image:image

});

}


/* ------------------------------------------
   取得できなかった場合
------------------------------------------ */

if(girls.length === 0){

girls.push({

name:"",

age:"",

size:"",

schedule:"",

catchCopy:"",

url:"",

image:""

});

}


return girls.slice(
0,
4
);

}


/* ==========================================
   1人分のHTML
========================================== */


function makeGirlHTML(girl){


let html = "";


/* 外枠 */

html += '<div>';


/* URL */

if(girl.url){

html +=
'<a href="' +
escapeHTML(girl.url) +
'">';

}


/* 画像 */

if(girl.image){

html +=

'<div style="text-align:center;">' +

'<img src="' +
escapeHTML(girl.image) +
'" width="260" height="350">' +

'</div>';

}


/* 名前 */

if(girl.name){

html +=

'<p style="text-align:center;">' +

'<strong>' +

'<font color="#ff00aa">' +

escapeHTML(girl.name);


if(girl.age){

html +=

' (' +
escapeHTML(girl.age) +
')';

}


html +=

'</font>' +

'</strong>' +

'</p>';

}


/* キャッチコピー */

if(girl.catchCopy){

html +=

'<p style="text-align:center;">' +

'<strong>' +

'<font color="#ff55bb">' +

escapeHTML(
girl.catchCopy
) +

'</font>' +

'</strong>' +

'</p>';

}


/* スリーサイズ */

if(girl.size){

html +=

'<p style="text-align:center;">' +

'<strong>' +

'<font color="#777777">' +

escapeHTML(
girl.size
) +

'</font>' +

'</strong>' +

'</p>';

}


/* 出勤 */

if(girl.schedule){

html +=

'<p style="text-align:center;">' +

'<strong>' +

'<font color="#ff00aa">' +

'出勤 ' +

escapeHTML(
girl.schedule
) +

'</font>' +

'</strong>' +

'</p>';

}


/* URL終了 */

if(girl.url){

html +=
'</a>';

}


/* 区切り */

html +=

'<hr>';


/* 外枠終了 */

html +=
'</div>';


return html;

}


/* ==========================================
   完成HTML
========================================== */


function makeCompleteHTML(girls){


let html = "";


html +=
'<div>';


for(
let i=0;
i<girls.length;
i++
){

html +=
makeGirlHTML(
girls[i]
);

}


html +=
'</div>';


return html;

}


/* ==========================================
   HTML作成
========================================== */


function createHTML(){


const source =
document.getElementById(
"source"
).value;


if(!source.trim()){

alert(
"抽出HTMLを貼り付けてください！"
);

return;

}


const girls =
getGirls(
source
);


const result =
makeCompleteHTML(
girls
);


document.getElementById(
"result"
).value =
result;


document.getElementById(
"message"
).style.display =
"none";

}


/* ==========================================
   コピー
========================================== */


async function copyHTML(){


const result =
document.getElementById(
"result"
);


if(!result.value){

alert(
"先に掲載用HTMLを作成してください！"
);

return;

}


try{

await navigator.clipboard.writeText(
result.value
);

}

catch(error){

result.removeAttribute(
"readonly"
);

result.select();

document.execCommand(
"copy"
);

result.setAttribute(
"readonly",
""
);

}


const message =
document.getElementById(
"message"
);


message.style.display =
"block";


setTimeout(function(){

message.style.display =
"none";

},2500);

}


</script>


</body>

</html>
